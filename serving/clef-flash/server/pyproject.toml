[project]
name = "clef-systemone-server"
version = "0.1.0"
description = "SystemOne HTTP runtime for Cloudflare CLEF-Flash"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.119,<1",
    "structlog>=25.4,<26",
    "uvicorn[standard]>=0.37,<1",
]

[project.optional-dependencies]
model = [
    "huggingface-hub>=0.35,<2",
    "pillow>=11.3,<12",
    "safetensors>=0.6,<1",
    "torch==2.11.0",
    "transformers==5.10.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clef_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
