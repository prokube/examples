apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow-isvc-sa
# imagePullSecrets grant access to the private prokube container registry
# where the custom MLflow storage-initializer image lives.
# These secrets are provisioned automatically by the prokube platform.
imagePullSecrets:
  - name: regcred-prokube
  - name: regcred-dev
# NOTE: intentionally does not reference the 's3creds' Secret.
# KServe v0.18.0 injects S3 env vars into the storage-initializer init
# container for every ISVC whose ServiceAccount references 's3creds'. When
# the storageUri uses the mlflow:// scheme the injected env contains both a
# plain 'value' field (from the secret's annotations) and a 'valueFrom'
# field on the same variable names (S3_ENDPOINT, AWS_ENDPOINT_URL,
# S3_USE_HTTPS). Kubernetes rejects that combination at admission, so pods
# are never created and the ISVC times out. By using a dedicated SA without
# 's3creds' the injection is skipped entirely.
