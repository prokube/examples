name: Build Images

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
    - main
    paths:
    - '**/VERSION'
    - .github/workflows/build-images.yaml

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ github.event_name == 'push' }}
      REGISTRY: ${{ github.event_name == 'push' && 'europe-west3-docker.pkg.dev/prokube/releases' || 'europe-west3-docker.pkg.dev/prokube/development' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - image: minimal-mnist
          context: images/minimal-mnist
          dockerfile: images/minimal-mnist/Dockerfile
        - image: streamlit-example
          context: images/streamlit-example
          dockerfile: images/streamlit-example/Dockerfile
        - image: mobile-price-classification
          context: pipelines/lightweight-python-package
          dockerfile: pipelines/lightweight-python-package/Dockerfile
        - image: minimal-custom-kserve-predictor
          context: serving/minimal-custom-kserve-predictor
          dockerfile: serving/minimal-custom-kserve-predictor/Dockerfile
        - image: minimal-predictor
          context: serving/minimal-example-shadow-deployment/minimal-predictor
          dockerfile: serving/minimal-example-shadow-deployment/minimal-predictor/Dockerfile
        - image: minimal-transformer
          context: serving/minimal-example-shadow-deployment/minimal-transformer
          dockerfile: serving/minimal-example-shadow-deployment/minimal-transformer/Dockerfile
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

    - name: Read image version
      id: version
      env:
        CONTEXT: ${{ matrix.context }}
      run: |
        set -euo pipefail
        VERSION=$(tr -d '[:space:]' < "$CONTEXT/VERSION")
        if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc(0|[1-9][0-9]*))?$ ]]; then
          echo "::error file=$CONTEXT/VERSION::VERSION must be X.Y.Z or X.Y.Z-rcN, got '$VERSION'"
          exit 1
        fi
        echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

    - name: Check image references
      env:
        IMAGE: ${{ matrix.image }}
        CONTEXT: ${{ matrix.context }}
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        set -euo pipefail
        status=0
        while IFS= read -r hit; do
          ref=${hit##*:}
          ref=${ref%.}
          if [[ "$ref" != "$TAG" ]]; then
            file=${hit%%:*}
            rest=${hit#*:}
            echo "::error file=$file,line=${rest%%:*}::References $IMAGE:$ref, but $CONTEXT/VERSION is ${TAG#v}"
            status=1
          fi
        done < <(git grep -n -o -E "prokube/releases/$IMAGE:v[0-9A-Za-z.-]+" || true)
        exit "$status"

    - name: Check version bump
      if: github.event_name == 'pull_request'
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        CONTEXT: ${{ matrix.context }}
      run: |
        set -euo pipefail
        if ! git diff --quiet "$BASE"...HEAD -- "$CONTEXT" \
          && git diff --quiet "$BASE"...HEAD -- "$CONTEXT/VERSION"; then
          echo "::warning file=$CONTEXT/VERSION::Files in $CONTEXT changed without a VERSION bump. Bump it if the image content changed; released tags are never rebuilt."
        fi

    - name: Authenticate to Google Cloud
      if: github.event_name != 'pull_request'
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Log in to Google Artifact Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: europe-west3-docker.pkg.dev
        username: _json_key
        password: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Docker Buildx
      if: github.event_name != 'pull_request'
      uses: docker/setup-buildx-action@v4

    - name: Check immutable release artifact
      id: image
      if: env.IS_RELEASE == 'true'
      env:
        IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.version.outputs.tag }}
      run: |
        set -euo pipefail
        if OUTPUT=$(gcloud artifacts docker images describe "$IMAGE" 2>&1); then
          echo "$IMAGE already exists; preserving the immutable release artifact"
          echo "exists=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ "$OUTPUT" != *"NOT_FOUND"* ]]; then
          echo "$OUTPUT" >&2
          exit 1
        fi

    - name: Build image
      if: github.event_name != 'pull_request' && steps.image.outputs.exists != 'true'
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        push: true
        tags: ${{ env.IS_RELEASE == 'true' && format('{0}/{1}:{2}', env.REGISTRY, matrix.image, steps.version.outputs.tag) || format('{0}/{1}:commit-{2},{0}/{1}:latest', env.REGISTRY, matrix.image, github.sha) }}
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image }}
