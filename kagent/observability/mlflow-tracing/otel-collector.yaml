# yamllint disable rule:document-start
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
      basicauth/mlflow:
        client_auth:
          username: ${env:MLFLOW_TRACKING_USERNAME}
          password: ${env:MLFLOW_TRACKING_PASSWORD}

    receivers:
      # Normal endpoint: traces sent here are simplified (see the "semantic"
      # processors below) before they reach MLflow.
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
      # Diagnostic endpoint: traces sent here reach MLflow unchanged, with
      # every HTTP call and internal step. Point an agent here only while you
      # troubleshoot it.
      otlp/diagnostic:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4319

    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 384
        spike_limit_mib: 128
      batch: {}

      # kagent records every request at several layers: the HTTP server, the
      # agent runner, the model client library, and each outgoing HTTP call.
      # In MLflow, the few steps you care about (the agent, its model calls,
      # and its tool calls) end up buried in dozens of technical spans.
      #
      # The two processors below keep those steps and remove the rest, so a
      # trace reads like this:
      #
      #   invoke_agent tracing_assistant        the agent handling one message
      #   └── chat claude-haiku-4-5-20251001    one model call, with its tokens
      #       └── generate_content ...          (tool calls appear below here)
      #
      # The rules match span names of the kagent 0.10 Python runtime. Check
      # them when you upgrade kagent.
      transform/semantic:
        error_mode: ignore
        trace_statements:
        - context: span
          statements:
          # Make the agent span the top of the trace. Its parents are the HTTP
          # request and the runner, which the filter below removes.
          - set(span.parent_span_id, SpanID(0x0000000000000000)) where IsMatch(span.name, "^invoke_agent ")
          # Rename the model call from "call_llm" to "chat <model>".
          - set(span.name, Concat(["chat", span.attributes["gen_ai.request.model"]], " ")) where span.name == "call_llm" and span.attributes["gen_ai.request.model"] != nil
          # The runner wraps each model call a second time. Tool calls hang
          # below that wrapper, so it has to stay, but without the model name
          # and token counts MLflow no longer shows it as a second model call.
          - delete_matching_keys(span.attributes, "^gen_ai\\.(usage\\..*|operation\\.name|request\\.model)$") where IsMatch(span.name, "^generate_content ")
      filter/semantic:
        error_mode: ignore
        traces:
          span:
          # The runner's span for the whole request. The agent span replaces it.
          - span.name == "invocation"
          # The model client library's copy of each model call.
          - IsMatch(span.name, "^(anthropic|openai)\\.(chat|completion)$")
          # HTTP traffic: the incoming request ("POST /") and the calls to the
          # model provider and to tools.
          - IsMatch(span.name, "^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)( |$)")

    exporters:
      otlphttp/mlflow:
        endpoint: ${env:MLFLOW_TRACKING_URI}
        auth:
          authenticator: basicauth/mlflow
        headers:
          X-Mlflow-Experiment-Id: ${env:MLFLOW_EXPERIMENT_ID}

    service:
      extensions:
      - health_check
      - basicauth/mlflow
      pipelines:
        traces:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - transform/semantic
          - filter/semantic
          - batch
          exporters:
          - otlphttp/mlflow
        traces/diagnostic:
          receivers:
          - otlp/diagnostic
          processors:
          - memory_limiter
          - batch
          exporters:
          - otlphttp/mlflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.159.0
        imagePullPolicy: IfNotPresent
        args:
        - --config=/conf/config.yaml
        env:
        - name: MY_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: MLFLOW_EXPERIMENT_ID
          value: "<experiment-id>"
        envFrom:
        - secretRef:
            name: mlflow-credentials
        ports:
        - name: otlp-grpc
          containerPort: 4317
          protocol: TCP
        - name: otlp-diag
          containerPort: 4319
          protocol: TCP
        - name: health
          containerPort: 13133
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: health
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: config
          mountPath: /conf
          readOnly: true
      terminationGracePeriodSeconds: 30
      volumes:
      - name: config
        configMap:
          name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
    protocol: TCP
  - name: otlp-grpc-diagnostic
    port: 4319
    targetPort: otlp-diag
    protocol: TCP
