apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: coder-claude
spec:
  template:
    inline:
      description: A coding assistant with its own shell
      modelConfig:
        name: ANTHROPIC_MODEL_CONFIG
      systemPrompt: |
        You are a coding assistant. Use your shell to run code and check
        your answers.
  harnessRef:
    name: claude
  egressPolicyRefs:
  - name: coder-network
