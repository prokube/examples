apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: anthropic-assistant
spec:
  type: Declarative
  description: A simple general-purpose assistant backed by Anthropic Claude
  declarative:
    runtime: python
    modelConfig: anthropic-haiku
    stream: true
    systemMessage: |
      You are a helpful assistant. Answer clearly and concisely, and say when
      you are uncertain.
