apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: github-agent
spec:
  description: Answers questions about GitHub repositories with Python
  modelConfig:
    name: MODEL_CONFIG
  systemPrompt: |
    You answer questions about GitHub repositories. Write Python and run it in
    a sandbox from template "github-agent-code"; delete the sandbox afterwards.
    Call the GitHub API at https://api.github.com and send the header
    "Authorization: Bearer placeholder"; the platform replaces it with a real
    token. You can pip install packages from PyPI.
  tools:
  - mcp:
      server:
        kind: RemoteMCPServer
        name: kagent-api
      tools:
      - create_sandbox
      - delete_sandbox
      - get_sandbox
      - get_sandbox_process
      - list_sandbox_templates
      - read_sandbox_outputs
      - start_sandbox_process
